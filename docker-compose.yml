services:
  postgres:
    image: postgres:16-alpine
    container_name: billpro_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-billpro}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-billpro_secure_password}
      POSTGRES_DB: ${DB_NAME:-billpro_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - billpro_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-billpro} -d ${DB_NAME:-billpro_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: billpro_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - billpro_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  billpro_pg_data:
    driver: local
  billpro_redis_data:
    driver: local
